<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - PageKit PRO</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap');

:root {
  --gold: #B8892A;
  --gold2: #E4B84A;
  --gold3: #F5D97A;
  --black: #0A0A0A;
  --charcoal: #1A1A1A;
  --rose: #C4526B;
  --white: #FFFFFF;
  --muted: #8A7A6A;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { font-family: 'Tajawal', sans-serif; background: #0f0a14; color: var(--white); overflow-x: hidden; }

#auth-section { min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
.auth-box { background: #150d22; border: 2px solid rgba(184,137,42,0.3); border-radius: 28px; padding: 40px; max-width: 450px; width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
.auth-box h2 { font-size: 24px; font-weight: 900; color: var(--gold2); margin-bottom: 8px; text-align: center; }
.auth-box p { text-align: center; color: var(--muted); margin-bottom: 24px; font-size: 13px; }
.f-group { margin-bottom: 18px; }
.f-group label { display: block; font-weight: 700; color: var(--gold2); margin-bottom: 8px; font-size: 13px; }
.f-group input { width: 100%; padding: 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; font-family: 'Tajawal'; font-size: 14px; outline: none; }
.f-group input:focus { border-color: var(--gold2); }
.auth-btns { display: flex; gap: 10px; margin-top: 20px; }
.btn-auth { flex: 1; padding: 14px; border-radius: 12px; font-weight: 900; cursor: pointer; border: none; font-size: 14px; transition: 0.2s; }
.btn-signin { background: linear-gradient(135deg, var(--gold), var(--gold2)); color: #000; }
.btn-signup { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
.btn-auth:hover { transform: translateY(-2px); }
.btn-auth:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
.msg { text-align:center; font-size:13px; margin-top:14px; min-height:18px; }
.msg.err { color: var(--rose); }
.msg.ok { color: #4ADE80; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<section id="auth-section">
  <div class="auth-box">
    <h2>منصة اللاندينج بيج الذكية</h2>
    <p>سجل دخولك أو أنشئ حساب جديد للوصول للوحة التحكم بتاعتك</p>

    <div class="f-group">
      <label>البريد الإلكتروني:</label>
      <input type="email" id="authEmail" placeholder="name@example.com">
    </div>

    <div class="f-group">
      <label>كلمة المرور:</label>
      <input type="password" id="authPassword" placeholder="••••••••">
    </div>

    <div class="auth-btns">
      <button class="btn-auth btn-signin" id="btnSignin" onclick="signIn()">دخول</button>
      <button class="btn-auth btn-signup" id="btnSignup" onclick="signUp()">حساب جديد</button>
    </div>

    <div class="msg" id="authMsg"></div>
  </div>
</section>

<script>
  // بيانات مشروعك على Supabase
  const SUPABASE_URL = 'https://yjvzwmbpdzlvxmfwikbu.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_qRIkc1Ziyp5cJ6BKp0KhWw_pj0meP0D';

  const { createClient } = supabase;
  const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showMsg(text, type) {
    const el = document.getElementById('authMsg');
    el.innerText = text;
    el.className = 'msg ' + (type || '');
  }

  function setLoading(isLoading) {
    document.getElementById('btnSignin').disabled = isLoading;
    document.getElementById('btnSignup').disabled = isLoading;
  }

  async function signUp() {
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;

    if (!email || !password) {
      showMsg('من فضلك أدخل البريد الإلكتروني وكلمة المرور', 'err');
      return;
    }

    setLoading(true);
    const { data, error } = await _supabase.auth.signUp({ email, password });
    setLoading(false);

    if (error) {
      showMsg('خطأ في التسجيل: ' + error.message, 'err');
    } else {
      showMsg('تم إنشاء الحساب بنجاح! يمكنك تسجيل الدخول الآن.', 'ok');
    }
  }

  async function signIn() {
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;

    if (!email || !password) {
      showMsg('من فضلك أدخل البريد الإلكتروني وكلمة المرور', 'err');
      return;
    }

    setLoading(true);
    const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
    setLoading(false);

    if (error) {
      showMsg('خطأ في تسجيل الدخول: تأكد من البيانات أو تفعيل الحساب.', 'err');
    } else {
      // نجح الدخول -> روح لصفحة الداشبورد
      window.location.href = 'dashboard.html';
    }
  }

  // لو المستخدم أصلاً مسجل دخول (session موجودة) حوّله على طول للداشبورد
  async function checkExistingSession() {
    const { data: { session } } = await _supabase.auth.getSession();
    if (session) {
      window.location.href = 'dashboard.html';
    }
  }

  window.onload = checkExistingSession;
</script>

</body>
</html>
