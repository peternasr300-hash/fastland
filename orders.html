<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الأوردرات - PageKit PRO</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap');

:root {
  --gold: #B8892A;
  --gold2: #E4B84A;
  --gold3: #F5D97A;
  --black: #0A0A0A;
  --rose: #C4526B;
  --white: #FFFFFF;
  --muted: #8A7A6A;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { font-family: 'Tajawal', sans-serif; background: #0f0a14; color: var(--white); min-height: 100vh; }

.top-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 18px 30px; background: rgba(20,10,30,0.9); backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(184,137,42,0.25); position: sticky; top: 0; z-index: 100;
  flex-wrap: wrap; gap: 12px;
}
.top-bar .brand { font-weight: 900; color: var(--gold2); font-size: 18px; }
.btn-back {
  background: rgba(255,255,255,0.08); color: var(--white); border: 1px solid rgba(255,255,255,0.15);
  padding: 8px 18px; border-radius: 20px; cursor: pointer; font-family: 'Tajawal'; font-size: 13px;
}
.btn-back:hover { background: rgba(255,255,255,0.15); }

.container { max-width: 1100px; margin: 0 auto; padding: 40px 24px; }

.header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 14px; }
.header-row h1 { font-size: 22px; font-weight: 900; }
.header-row p { color: var(--muted); font-size: 13px; margin-top: 4px; }

.toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 12px; }
.select-all-wrap { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.select-all-wrap input { width: 16px; height: 16px; cursor: pointer; }

.btn-export {
  background: linear-gradient(135deg, #16a34a, #4ADE80); color: #06240f; font-weight: 900;
  padding: 12px 24px; border-radius: 30px; border: none; cursor: pointer; font-size: 14px; font-family: 'Tajawal';
  box-shadow: 0 8px 20px rgba(74,222,128,0.3);
}
.btn-export:hover { transform: translateY(-2px); }
.btn-export:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.stats-row { display: flex; gap: 14px; margin-bottom: 24px; flex-wrap: wrap; }
.stat-box { background: #150d22; border: 1px solid rgba(184,137,42,0.25); border-radius: 14px; padding: 14px 20px; flex: 1; min-width: 140px; }
.stat-box .num { font-size: 26px; font-weight: 900; color: var(--gold2); }
.stat-box .lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* الجدول */
.orders-table-wrap { background: #150d22; border: 2px solid rgba(184,137,42,0.2); border-radius: 20px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 14px 16px; text-align: right; font-size: 13px; }
thead th { background: rgba(184,137,42,0.08); color: var(--gold2); font-weight: 700; font-size: 12px; white-space: nowrap; }
tbody tr { border-top: 1px solid rgba(255,255,255,0.05); }
tbody tr:hover { background: rgba(255,255,255,0.02); }
td.checkbox-cell { width: 40px; }
td.checkbox-cell input { width: 16px; height: 16px; cursor: pointer; }
.exported-badge { font-size: 10px; background: rgba(74,222,128,0.15); color: #4ADE80; padding: 3px 10px; border-radius: 20px; font-weight: 700; }
.pending-badge { font-size: 10px; background: rgba(255,255,255,0.08); color: var(--muted); padding: 3px 10px; border-radius: 20px; font-weight: 700; }
.page-name { color: var(--muted); font-size: 11px; }

.empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
.loading { text-align: center; color: var(--muted); padding: 40px; font-size: 14px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div class="top-bar">
  <div class="brand">⚡ PageKit PRO</div>
  <button class="btn-back" onclick="window.location.href='dashboard.html'">→ رجوع للوحة التحكم</button>
</div>

<div class="container">
  <div class="header-row">
    <div>
      <h1>📦 الأوردرات</h1>
      <p>كل الطلبات اللي جاتلك من كل اللاندينج بيدجز بتاعتك</p>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-box"><div class="num" id="totalCount">0</div><div class="lbl">إجمالي الأوردرات</div></div>
    <div class="stat-box"><div class="num" id="pendingCount">0</div><div class="lbl">لسه ماتصدرتش</div></div>
    <div class="stat-box"><div class="num" id="exportedCount">0</div><div class="lbl">اتصدرت بالفعل</div></div>
  </div>

  <div class="toolbar">
    <div class="select-all-wrap">
      <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this.checked)">
      <label for="selectAllCheckbox">تحديد الكل</label>
    </div>
    <button class="btn-export" id="btnExport" onclick="exportSelected()" disabled>⬇️ تصدير المحدد لملف Excel</button>
  </div>

  <div id="contentArea">
    <div class="loading">جاري التحميل...</div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://yjvzwmbpdzlvxmfwikbu.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_qRIkc1Ziyp5cJ6BKp0KhWw_pj0meP0D';

  const { createClient } = supabase;
  const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUserId = null;
  let allOrders = [];

  async function loadOrders() {
    const { data: { session } } = await _supabase.auth.getSession();
    if (!session) {
      window.location.href = 'login.html';
      return;
    }
    currentUserId = session.user.id;

    const { data: orders, error } = await _supabase
      .from('orders')
      .select('*, user_pages(page_title)')
      .eq('user_id', currentUserId)
      .order('created_at', { ascending: false });

    const contentArea = document.getElementById('contentArea');

    if (error) {
      contentArea.innerHTML = '<div class="loading">حصل خطأ: ' + error.message + '</div>';
      return;
    }

    allOrders = orders || [];
    renderStats();
    renderTable();
  }

  function renderStats() {
    document.getElementById('totalCount').innerText = allOrders.length;
    document.getElementById('pendingCount').innerText = allOrders.filter(o => !o.exported).length;
    document.getElementById('exportedCount').innerText = allOrders.filter(o => o.exported).length;
  }

  function renderTable() {
    const contentArea = document.getElementById('contentArea');

    if (allOrders.length === 0) {
      contentArea.innerHTML = `
        <div class="orders-table-wrap">
          <div class="empty-state">
            <p>لسه معندكش أي أوردرات 📭</p>
          </div>
        </div>`;
      return;
    }

    let rows = '';
    allOrders.forEach(o => {
      const dateStr = new Date(o.created_at).toLocaleString('ar-EG', { dateStyle: 'medium', timeStyle: 'short' });
      const pageName = o.user_pages ? o.user_pages.page_title : '-';
      rows += `
        <tr>
          <td class="checkbox-cell"><input type="checkbox" class="order-check" data-id="${o.id}" onchange="updateExportButton()"></td>
          <td>${escapeHtml(o.customer_name || '-')}</td>
          <td style="direction:ltr; text-align:right;">${escapeHtml(o.customer_phone || '-')}</td>
          <td>${escapeHtml(o.product_title || '-')}</td>
          <td>${escapeHtml(o.product_price || '-')} ج.م</td>
          <td class="page-name">${escapeHtml(pageName)}</td>
          <td>${dateStr}</td>
          <td>${o.exported ? '<span class="exported-badge">✅ اتصدر</span>' : '<span class="pending-badge">⏳ لسه</span>'}</td>
        </tr>`;
    });

    contentArea.innerHTML = `
      <div class="orders-table-wrap">
        <table>
          <thead>
            <tr>
              <th></th>
              <th>اسم العميل</th>
              <th>رقم الموبايل</th>
              <th>المنتج</th>
              <th>السعر</th>
              <th>اللاندينج</th>
              <th>التاريخ</th>
              <th>الحالة</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  function toggleSelectAll(checked) {
    document.querySelectorAll('.order-check').forEach(cb => cb.checked = checked);
    updateExportButton();
  }

  function updateExportButton() {
    const checked = document.querySelectorAll('.order-check:checked').length;
    document.getElementById('btnExport').disabled = checked === 0;
  }

  async function exportSelected() {
    const checkedBoxes = Array.from(document.querySelectorAll('.order-check:checked'));
    const selectedIds = checkedBoxes.map(cb => cb.dataset.id);

    if (selectedIds.length === 0) return;

    const selectedOrders = allOrders.filter(o => selectedIds.includes(o.id));

    // تجهيز بيانات ملف الإكسيل
    const excelData = selectedOrders.map(o => ({
      'اسم العميل': o.customer_name || '',
      'رقم الموبايل': o.customer_phone || '',
      'المنتج': o.product_title || '',
      'السعر': o.product_price || '',
      'اللاندينج بيدج': o.user_pages ? o.user_pages.page_title : '',
      'التاريخ': new Date(o.created_at).toLocaleString('ar-EG'),
    }));

    const worksheet = XLSX.utils.json_to_sheet(excelData);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, 'الأوردرات');
    XLSX.writeFile(workbook, 'اوردرات_' + new Date().toISOString().slice(0,10) + '.xlsx');

    // علّم على الأوردرات دي إنها اتصدرت
    const btn = document.getElementById('btnExport');
    btn.disabled = true;
    btn.innerText = 'جاري التحديث...';

    const { error } = await _supabase
      .from('orders')
      .update({ exported: true })
      .in('id', selectedIds);

    btn.innerText = '⬇️ تصدير المحدد لملف Excel';

    if (error) {
      alert('تم تنزيل الملف، لكن حصل خطأ في تحديث الحالة: ' + error.message);
    }

    await loadOrders();
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.innerText = str;
    return div.innerHTML;
  }

  window.onload = loadOrders;
</script>

</body>
</html>
