<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم - PageKit PRO</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap');

:root {
  --gold: #B8892A;
  --gold2: #E4B84A;
  --gold3: #F5D97A;
  --black: #0A0A0A;
  --charcoal: #1A1A1A;
  --rose: #C4526B;
  --white: #FFFFFF;
  --muted: #8A7A6A;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { font-family: 'Tajawal', sans-serif; background: #0f0a14; color: var(--white); min-height: 100vh; }

/* الهيدر */
.top-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 18px 30px; background: rgba(20,10,30,0.9); backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(184,137,42,0.25); position: sticky; top: 0; z-index: 100;
  flex-wrap: wrap; gap: 12px;
}
.top-bar .brand { font-weight: 900; color: var(--gold2); font-size: 18px; }
.user-info { display: flex; align-items: center; gap: 14px; font-size: 13px; }
#userEmailDisplay { color: var(--gold2); font-weight: 700; }
.btn-logout { background: #dc2626; color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; font-family: 'Tajawal'; font-size: 13px; }
.btn-logout:hover { background: #b91c1c; }
.btn-orders { background: rgba(184,137,42,0.15); color: var(--gold2); border: 1px solid rgba(184,137,42,0.4); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 700; font-family: 'Tajawal'; font-size: 13px; }
.btn-orders:hover { background: rgba(184,137,42,0.25); }

/* المحتوى */
.container { max-width: 1100px; margin: 0 auto; padding: 40px 24px; }

.welcome-row {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 30px; flex-wrap: wrap; gap: 16px;
}
.welcome-row h1 { font-size: 24px; font-weight: 900; color: var(--white); }
.welcome-row h1 span { color: var(--gold2); }
.welcome-row p { color: var(--muted); font-size: 13px; margin-top: 6px; }

.btn-create {
  background: linear-gradient(135deg, var(--gold), var(--gold2)); color: #000;
  font-weight: 900; padding: 14px 26px; border-radius: 40px; border: none;
  cursor: pointer; font-size: 15px; box-shadow: 0 8px 25px rgba(184,137,42,0.4);
  white-space: nowrap; font-family: 'Tajawal';
}
.btn-create:hover { transform: translateY(-2px); }

/* عداد اللاندينجز والأوردرات */
.stats-row { display: flex; gap: 16px; margin-bottom: 30px; flex-wrap: wrap; }
.stats-box {
  background: #150d22; border: 2px solid rgba(184,137,42,0.3); border-radius: 20px;
  padding: 22px 26px; display: flex; align-items: center; gap: 16px; flex: 1; min-width: 220px;
}
.stats-box .num { font-size: 36px; font-weight: 900; color: var(--gold2); line-height: 1; }
.stats-box .label { color: var(--muted); font-size: 13px; }
.stats-box.orders-today .num { color: #4ADE80; }
.stats-box.orders-total .num { color: var(--gold3); }

/* الكروت */
.cards-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px;
}
.card {
  background: #150d22; border: 2px solid rgba(184,137,42,0.2); border-radius: 20px;
  padding: 24px; cursor: pointer; transition: 0.2s; position: relative; overflow: hidden;
}
.card:hover { border-color: var(--gold2); transform: translateY(-4px); box-shadow: 0 10px 30px rgba(184,137,42,0.15); }
.card .tag { font-size: 11px; color: var(--muted); margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
.status-badge { font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 20px; }
.status-badge.live { background: rgba(74,222,128,0.15); color: #4ADE80; }
.status-badge.draft { background: rgba(255,255,255,0.08); color: var(--muted); }
.card h3 { font-size: 17px; font-weight: 900; color: var(--white); margin-bottom: 12px; min-height: 46px; }
.card .price { color: var(--gold3); font-weight: 700; font-size: 14px; margin-bottom: 6px; }
.card .whatsapp { color: var(--muted); font-size: 12px; }
.card .card-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
.card-thumb { width: 100%; height: 120px; object-fit: cover; border-radius: 12px; margin-bottom: 12px; background: rgba(255,255,255,0.04); }
.color-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-left: 5px; vertical-align: middle; }
.card .edit-hint { font-size: 12px; color: var(--gold2); font-weight: 700; }
.card .view-live { font-size: 12px; color: var(--muted); text-decoration: none; border-bottom: 1px dashed var(--muted); }
.card .view-live:hover { color: var(--gold3); border-color: var(--gold3); }
.card .view-orders { font-size: 12px; color: var(--gold2); text-decoration: none; font-weight: 700; }
.card .view-orders:hover { color: var(--gold3); }
.card .card-actions-row2 { display: flex; justify-content: flex-end; margin-top: 8px; }

/* حالة عدم وجود لاندينجز */
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--muted);
  background: #150d22; border: 2px dashed rgba(184,137,42,0.25); border-radius: 20px;
}
.empty-state p { font-size: 15px; margin-bottom: 6px; }
.empty-state span { font-size: 13px; }

.loading { text-align: center; color: var(--muted); padding: 40px; font-size: 14px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="top-bar">
  <div class="brand">⚡ PageKit PRO</div>
  <div class="user-info">
    <button class="btn-orders" onclick="window.location.href='orders.html'">📦 الأوردرات</button>
    <span id="userEmailDisplay"></span>
    <button class="btn-logout" onclick="signOut()">تسجيل خروج</button>
  </div>
</div>

<div class="container">
  <div class="welcome-row">
    <div>
      <h1>أهلاً بيك، <span id="userNameDisplay">...</span> 👋</h1>
      <p>ده كل اللاندينج بيدجز اللي عملتها</p>
    </div>
    <button class="btn-create" onclick="goCreateNew()">➕ إنشاء لاندينج بيدج جديدة</button>
  </div>

  <div class="stats-row">
    <div class="stats-box">
      <div class="num" id="pagesCount">0</div>
      <div class="label">لاندينج بيدج تم إنشاؤها</div>
    </div>
    <div class="stats-box orders-today">
      <div class="num" id="todayOrdersCount">0</div>
      <div class="label">أوردرات النهاردة</div>
    </div>
    <div class="stats-box orders-total">
      <div class="num" id="totalOrdersCount">0</div>
      <div class="label">إجمالي الأوردرات</div>
    </div>
  </div>

  <div id="contentArea">
    <div class="loading">جاري التحميل...</div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://yjvzwmbpdzlvxmfwikbu.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_qRIkc1Ziyp5cJ6BKp0KhWw_pj0meP0D';

  const { createClient } = supabase;
  const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function signOut() {
    await _supabase.auth.signOut();
    window.location.href = 'login.html';
  }

  function goCreateNew() {
    // من غير id في اللينك = لاندينج جديدة
    window.location.href = 'editor.html';
  }

  function goEdit(id) {
    window.location.href = 'editor.html?id=' + id;
  }

  async function loadDashboard() {
    const { data: { session } } = await _supabase.auth.getSession();

    if (!session) {
      // مفيش يوزر مسجل دخول -> رجّعه لصفحة اللوجين
      window.location.href = 'login.html';
      return;
    }

    document.getElementById('userEmailDisplay').innerText = session.user.email;
    document.getElementById('userNameDisplay').innerText = session.user.email;

    const { data: pages, error } = await _supabase
      .from('user_pages')
      .select('*')
      .eq('user_id', session.user.id)
      .order('created_at', { ascending: false });

    const contentArea = document.getElementById('contentArea');

    if (error) {
      contentArea.innerHTML = '<div class="loading">حصل خطأ أثناء تحميل البيانات: ' + error.message + '</div>';
      return;
    }

    document.getElementById('pagesCount').innerText = pages.length;

    // إحصائيات الأوردرات
    const startOfDay = new Date();
    startOfDay.setHours(0, 0, 0, 0);

    const { count: todayCount } = await _supabase
      .from('orders')
      .select('*', { count: 'exact', head: true })
      .eq('user_id', session.user.id)
      .gte('created_at', startOfDay.toISOString());

    const { count: totalCount } = await _supabase
      .from('orders')
      .select('*', { count: 'exact', head: true })
      .eq('user_id', session.user.id);

    document.getElementById('todayOrdersCount').innerText = todayCount || 0;
    document.getElementById('totalOrdersCount').innerText = totalCount || 0;

    if (pages.length === 0) {
      contentArea.innerHTML = `
        <div class="empty-state">
          <p>لسه معملتش أي لاندينج بيدج 🙁</p>
          <span>دوس على "إنشاء لاندينج بيدج جديدة" فوق عشان تبدأ أول واحدة</span>
        </div>`;
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'cards-grid';

    pages.forEach(page => {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => goEdit(page.id);

      const liveLinkHtml = page.is_published
        ? `<a class="view-live" href="landing.html?id=${page.id}" target="_blank" onclick="event.stopPropagation()">👁️ اللينك الحقيقي</a>`
        : `<span class="view-live" style="opacity:0.5; border-color:transparent;">لسه مسودة</span>`;

      let thumbUrl = null;
      try {
        const imgs = page.images ? JSON.parse(page.images) : [];
        if (imgs.length > 0) thumbUrl = imgs[0];
      } catch (e) {}

      const thumbHtml = thumbUrl ? `<img class="card-thumb" src="${thumbUrl}" alt="">` : '';

      card.innerHTML = `
        ${thumbHtml}
        <div class="tag">
          <span>لاندينج بيدج</span>
          <span class="status-badge ${page.is_published ? 'live' : 'draft'}">${page.is_published ? '🟢 منشورة' : '📝 مسودة'}</span>
        </div>
        <h3>${escapeHtml(page.page_title || 'بدون عنوان')}</h3>
        <div class="price">💰 ${escapeHtml(page.product_price || '-')} جنيه</div>
        <div class="whatsapp">📱 ${escapeHtml(page.whatsapp_number || '-')}</div>
        <div class="card-actions">
          <span class="edit-hint">اضغط للتعديل ←</span>
          ${liveLinkHtml}
        </div>
        <div class="card-actions-row2">
          <a class="view-orders" href="orders.html?page_id=${page.id}" onclick="event.stopPropagation()">📦 أوردرات اللاند دي</a>
        </div>
      `;
      grid.appendChild(card);
    });

    contentArea.innerHTML = '';
    contentArea.appendChild(grid);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.innerText = str;
    return div.innerHTML;
  }

  window.onload = loadDashboard;
</script>

</body>
</html>
